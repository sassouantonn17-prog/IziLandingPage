<!doctype html>
<html lang="fr" class="scroll-smooth bg-[#08080C] text-[#FAF8F5]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230D0D12'/><path d='M30 65 L45 35 L70 35 L55 65 Z' fill='%23C9A84C'/><circle cx='68' cy='42' r='6' fill='%23E2C875'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LivrExpress — Vos colis livrés en 2h partout à Dakar</title>
    <meta name="description" content="LivrExpress : Service de livraison express à Dakar. Vos colis et documents importants livrés en moins de 2 heures en toute sécurité." />
    
    <!-- Google Fonts: Plus Jakarta Sans (ultra lisible et moderne), Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#08080C] text-[#FAF8F5] font-sans antialiased overflow-x-hidden selection:bg-[#C9A84C]/30 selection:text-[#FAF8F5]">
    <!-- Global SVG Noise Texture Definition for Sub-layer Organic Grain -->
    <svg class="sr-only" aria-hidden="true">
      <filter id="cinematic-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
    </svg>

    <!-- Global Noise Overlay (opacity 0.04) -->
    <div class="pointer-events-none fixed inset-0 z-[999] opacity-[0.035] mix-blend-overlay grain-bg" aria-hidden="true"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
